name: Issue Created and Label Found

on:
  issues:
    types: [opened]  # Trigger when an issue is opened
  issue_comment:
    types: [created]  # Trigger when a new comment is created


jobs:
  label_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Check if "data retrieval" label is present
        id: check_label
        run: |
          echo "Labels: ${{ toJson(github.event.issue.labels) }}"
    
          if [[ "${{ contains(github.event.issue.labels.*.name, 'data retrieval') }}" == "true" ]]; then
            echo "Label 'data retrieval' found. Proceeding..."
            echo "label_found=true" >> $GITHUB_ENV
          else
            echo "Label 'data retrieval' not found. Exiting..."
            echo "label_found=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Extract the "Link to Your Folder" from issue body
        id: extract_link
        uses: actions/github-script@v6
        with:
          script: |
            const issueBody = `${{ github.event.issue.body }}`;
            const linkPattern = /(gs:\/\/[^\s]+\.tar\.gz)/;

            const match = issueBody.match(linkPattern);
            
            if (match && match[1]) {
              const folderLink = match[1];
              console.log(`Found link: ${folderLink}`);
              echo "::set-output name=folderlinkl::$folderlink"
            } else {
              throw new Error('Link not found in issue body');
            }

            const emailPattern = /id:\s*email\s*[\s\S]*?attributes:\s*label:\s*"Your UC Berkeley Email Address"[\s\S]*?attributes:\s*value:\s*"([^"]+)"/;
          
            const match = issueBody.match(emailPattern);
          
            if (match && match[1]) {
              const email = match[1];
              console.log(`Found email: ${email}`);
              // Set the extracted email as an output
              echo "::set-output name=email::${email}";
            } else {
              throw new Error('Email not found in issue body');
            }
        

      - name: Set up Python environment
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install Google Cloud SDK and Python Client Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --upgrade google-cloud-storage google-auth google-auth-oauthlib google-auth-httplib2

      - name: Set up Google Cloud credentials
        run: |
          echo "${{ secrets.DATA_RETRIEVAL_SA }}" > "${HOME}/gcp-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${HOME}/gcp-service-account.json"

      - name: Generate Signed URL for GCS Object
        env:
          EXTRACTED_LINK: ${{ steps.extract_link.outputs.folderlink }}
        run: |
          python3 .github/scripts/sign_url.py
          
